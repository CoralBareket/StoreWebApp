<section class="flex min-h-screen items-center justify-center px-4">
  <div class="w-full max-w-md rounded-xl border p-8">
    <h1 class="mb-6 text-2xl font-bold">Login</h1>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="mb-4">
        <label for="userName" class="mb-1 block">Username</label>

        <input
          id="userName"
          type="text"
          formControlName="userName"
          class="w-full rounded border p-2"
        />
      </div>

      <div class="mb-4">
        <label for="password" class="mb-1 block">Password</label>

        <input
          id="password"
          type="password"
          formControlName="password"
          class="w-full rounded border p-2"
        />
      </div>

      @if (errorMessage()) {
        <p class="mb-4 text-red-600">
          {{ errorMessage() }}
        </p>
      }

      <button
        type="submit"
        [disabled]="loginForm.invalid || isSubmitting"
        class="w-full rounded border p-2"
      >
        {{ isSubmitting ? 'Logging in...' : 'Login' }}
      </button>
    </form>
  </div>
</section>
